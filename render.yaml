# Render blueprint: one web service runs the API and serves the built React site.
# In Render: New > Blueprint > pick this repo, then fill in MONGODB_URI and ADMIN_PASSWORD_HASH.
services:
  - type: web
    name: cmtmc
    runtime: node
    plan: free
    buildCommand: npm --prefix server install && npm --prefix client install --include=dev && npm --prefix client run build
    # Seeds an empty database and loads the real people once, then starts the server
    startCommand: cd server && node src/seed.js && node src/importOld.js --once && node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_EMAIL
        value: walvekarchaitanya@gmail.com
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CROSSREF_MAILTO
        value: walvekarchaitanya@gmail.com
