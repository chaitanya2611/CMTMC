# Render blueprint: deploys the API as a web service and the React app as a static site.
# In Render: New > Blueprint > pick this repo. Fill in the "sync: false" values when asked.
services:
  - type: web
    name: cmtmc-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: CROSSREF_MAILTO
        sync: false

  - type: web
    name: cmtmc-web
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
